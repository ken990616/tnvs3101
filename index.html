radient(130deg,#e2d2ff,#b8e9ec)}.hidden{display:none!important}.message{border-bottom:1px solid var(--border);padding:15px 0}.message:last-child{border:0}.message strong{font-size:14px}.message p{margin:6px 0;color:var(--text)}.message small{color:var(--muted)}.modalbg{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,460px);max-height:90vh;overflow:auto;background:var(--panel);border-radius:var(--radius);padding:26px}.modal h2{margin-top:0}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:transparent;border:0;color:var(--muted);font-size:25px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{text-align:center;padding:10px 2px;min-height:52px;border:1px solid var(--border);border-radius:9px;font-size:13px}.day.h{background:var(--soft);color:var(--primary);font-weight:800;min-height:auto}.day.eventday{border-color:var(--primary);background:var(--soft);cursor:pointer}.dot{height:5px;width:5px;border-radius:50%;background:var(--primary);margin:5px auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}.adminbar{padding:12px;border-radius:10px;background:var(--soft);color:var(--primary);margin-bottom:15px;font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.topin{padding:12px}.brand{width:100%}.nav{overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap;padding:9px}.hero{padding:25px}.hero h1{font-size:24px}.hero .symbol{font-size:38px}.wrap{padding:15px}.themes button{padding:8px}.card{padding:17px}}
</style></head><body data-theme="B"><header class="top"><div class="topin"><div class="brand">📚 學習中心<small>電子佈告欄 SYSTEM</small></div><nav class="nav" id="nav"></nav><button class="login" onclick="openLogin()" id="loginBtn">管理員登入</button></div></header><main class="wrap"><section class="hero"><div><h1>學習中心電子佈告欄</h1><p>最新消息、活動報名、班級日程與美好回憶，都在這裡。</p></div><div class="symbol">📖</div></section><div id="view"></div><footer class="footer">學習中心電子佈告欄 · B 專業管理版｜尚未連接 Firebase，資料僅儲存於此瀏覽器</footer></main><div id="overlay" class="modalbg hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script>
const pages=['首頁','公告事項','班級行事曆','留言板','生活花絮','管理後台'];let page='首頁',admin=false,selectedMonth=new Date().getMonth(),selectedYear=new Date().getFullYear();const key='learning-board-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{ann:[{id:1,type:'文字公告',title:'歡迎使用學習中心電子佈告欄',body:'這裡會發布學習中心的重要消息，歡迎大家隨時查看。',date:'2026-10-27'},{id:2,type:'報名公告',title:'秋季戶外學習活動報名',body:'歡迎有興趣的同學參加，請填寫姓名完成報名。',date:'2026-10-26',count:20,entries:[]},{id:3,type:'投票公告',title:'下次班級活動想去哪裡？',body:'選出你最想參加的活動！',date:'2026-10-25',options:['戶外踏青','電影欣賞','桌遊同樂'],votes:[] }],events:[{id:1,date:'2026-10-30',title:'班級交流活動',desc:'下午 2:00 · 學習中心'},{id:2,date:'2026-11-05',title:'期中學習成果分享',desc:'上午 10:00 · 教室'}],messages:[{id:1,name:'小明',body:'期待接下來的班級活動！',date:'2026/10/27 10:30'}],albums:[{id:1,title:'我們的學習日常',desc:'一起努力的每一天',icon:'📚'},{id:2,title:'戶外探索活動',desc:'留下最開心的回憶',icon:'🌳'},{id:3,title:'班級交流時光',desc:'一起分享與成長',icon:'🎉'}]};function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function theme(t){document.body.dataset.theme=t;localStorage.setItem('board-theme',t);document.querySelectorAll('.themes button').forEach((b,i)=>b.classList.toggle('active','ABCD'[i]===t))}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function navRender(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');document.getElementById('loginBtn').textContent=admin?'管理員登出':'管理員登入'}function head(t,extra=''){return `<div class="sectionhead"><h2>${t}</h2><span>${extra}</span></div>`}function annCard(a){return `<div class="card"><span class="tag">${esc(a.type)}</span><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p><div class="meta">📅 ${esc(a.date)}</div><div class="actions">${a.type==='報名公告'?`<button class="primary" onclick="signup(${a.id})">我要報名 (${(a.entries||[]).length}/${a.count||'不限'})</button>`:a.type==='投票公告'?`<button class="primary" onclick="vote(${a.id})">參與投票</button>`:''}${admin?`<button class="outline" onclick="removeItem('ann',${a.id})">刪除公告</button>`:''}</div></div>`}function events(){return state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="event"><div class="datebox"><small>${esc(e.date.slice(5,7))}月</small><b>${esc(e.date.slice(8))}</b></div><div><strong>${esc(e.title)}</strong><span>${esc(e.desc)}</span></div>${admin?`<button class="outline" style="margin-left:auto" onclick="removeItem('events',${e.id})">刪除</button>`:''}</div>`).join('')||'<div class="empty">目前沒有活動</div>'}function msg(){return state.messages.slice().reverse().map(m=>`<div class="message"><strong>👤 ${esc(m.name)}</strong><small>　${esc(m.date)}</small><p>${esc(m.body)}</p>${admin?`<button class="outline" onclick="removeItem('messages',${m.id})">刪除留言</button>`:''}</div>`).join('')||'<div class="empty">還沒有留言，歡迎留下第一則！</div>'}function albums(){return state.albums.map((a,i)=>`<div class="card"><div class="photo ${['','two','three'][i%3]}">${esc(a.icon)}</div><h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p>${admin?`<button class="outline" onclick="removeItem('albums',${a.id})">刪除相簿</button>`:''}</div>`).join('')}function calendar(){let first=new Date(selectedYear,selectedMonth,1).getDay(),total=new Date(selectedYear,selectedMonth+1,0).getDate(),cells=['日','一','二','三','四','五','六'].map(x=>`<div class="day h">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=total;d++){let dt=`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=state.events.some(e=>e.date===dt);cells+=`<div class="day ${has?'eventday':''}" ${has?`onclick="showEvents('${dt}')"`:''}>${d}${has?'<div class="dot"></div>':''}</div>`}return `<div class="card"><div class="toolbar" style="justify-content:space-between;margin-bottom:15px"><button class="outline" onclick="month(-1)">‹ 上個月</button><strong>${selectedYear} 年 ${selectedMonth+1} 月</strong><button class="outline" onclick="month(1)">下個月 ›</button></div><div class="cal">${cells}</div></div>`}function render(){navRender();let v=document.getElementById('view');if(page==='首頁'){v.innerHTML=head('📢 最新公告','查看學習中心的最新消息')+`<div class="grid">${state.ann.slice(0,3).map(annCard).join('')}</div>`+head('📅 近期活動')+`<div class="row"><div class="card">${events()}</div><div class="card"><h3>💬 留言板</h3>${msg().slice(0,1200)}<button class="outline" onclick="go('留言板')">前往留言板 →</button></div></div>`+head('📸 生活花絮')+`<div class="grid">${albums()}</div>`}else if(page==='公告事項'){v.innerHTML=head('📢 公告事項','文字公告 · 報名公告 · 投票公告')+(admin?'<button class="primary" onclick="addAnnouncement()">＋ 新增公告</button>':'')+`<div class="grid" style="margin-top:15px">${state.ann.map(annCard).join('')}</div>`}else if(page==='班級行事曆'){v.innerHTML=head('📅 班級行事曆','點擊有標記的日期查看活動')+(admin?'<button class="primary" onclick="addEvent()">＋ 新增活動</button>':'')+`<div class="row" style="margin-top:15px">${calendar()}<div class="card"><h3>活動清單</h3>${events()}</div></div>`}else if(page==='留言板'){v.innerHTML=head('💬 留言板','留下姓名與想說的話')+`<div class="row"><div class="card"><h3>我要留言</h3><label class="label">姓名</label><input class="field" id="msgName" maxlength="30" placeholder="請輸入姓名"><label class="label">留言內容</label><textarea class="field" id="msgBody" rows="5" maxlength="500" placeholder="想分享什麼呢？"></textarea><button class="primary" onclick="postMessage()">送出留言</button></div><div class="card"><h3>最新留言</h3>${msg()}</div></div>`}else if(page==='生活花絮'){v.innerHTML=head('📸 生活花絮','記錄學習中心的精彩時刻')+(admin?'<button class="primary" onclick="addAlbum()">＋ 新增相簿</button>':'')+`<div class="grid" style="margin-top:15px">${albums()}</div>`+`<p class="muted">展示版使用圖示佔位；正式版將支援管理員上傳照片及建立相簿。</p>`}else{v.innerHTML=head('🔐 管理後台')+(admin?`<div class="adminbar">✓ 已進入展示管理模式。可新增公告、活動與相簿，並刪除留言。</div><div class="grid"><div class="card"><h3>📢 公告管理</h3><p>共 ${state.ann.length} 則公告</p><button class="primary" onclick="go('公告事項')">管理公告</button></div><div class="card"><h3>📅 行事曆管理</h3><p>共 ${state.events.length} 個活動</p><button class="primary" onclick="go('班級行事曆')">管理活動</button></div><div class="card"><h3>💬 留言管理</h3><p>共 ${state.messages.length} 則留言</p><button class="primary" onclick="go('留言板')">管理留言</button></div><div class="card"><h3>📸 相簿管理</h3><p>共 ${state.albums.length} 個相簿</p><button class="primary" onclick="go('生活花絮')">管理相簿</button></div></div><p class="muted">展示版管理登入不是正式安全驗證。</p>`:`<div class="card" style="max-width:520px"><h3>管理員專區</h3><p>此區僅供管理人員操作。展示版可直接體驗管理功能。</p><button class="primary" onclick="openLogin()">進入展示管理模式</button></div>`)} }function modal(html){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${html.title}</h2><button class="close" onclick="closeModal()">×</button></div>${html.body}`;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden')}function openLogin(){if(admin){admin=false;render();return}modal({title:'🔐 管理員登入',body:`<p class="muted">目前為介面展示，點擊下方按鈕即可體驗管理員功能；正式版將採用安全的帳號密碼驗證。</p><button class="primary" onclick="admin=true;closeModal();go('管理後台')">進入展示管理模式</button>`})}function removeItem(kind,id){if(!admin)return;if(confirm('確定刪除這筆資料？')){state[kind]=state[kind].filter(x=>x.id!==id);save();render()}}function signup(id){let a=state.ann.find(x=>x.id===id);modal({title:'📝 活動報名',body:`<p>${esc(a.title)}</p><label class="label">報名姓名</label><input class="field" id="signName" maxlength="30" placeholder="請輸入姓名"><button class="primary" onclick="doSignup(${id})">確認報名</button>`})}function doSignup(id){let a=state.ann.find(x=>x.id===id),name=document.getElementById('signName').value.trim();if(!name)return alert('請輸入姓名');a.entries=a.entries||[];if(a.entries.some(x=>x===name))return alert('此姓名已報名');if(a.count&&a.entries.length>=a.count)return alert('名額已滿');a.entries.push(name);save();closeModal();render();alert('展示報名成功（僅儲存在此瀏覽器）')}function vote(id){let a=state.ann.find(x=>x.id===id);modal({title:'🗳️ 參與投票',body:`<p>${esc(a.title)}</p><label class="label">投票姓名</label><input class="field" id="voteName" maxlength="30" placeholder="請輸入姓名"><label class="label">選擇選項</label>${a.options.map((o,i)=>`<label style="display:block;padding:9px"><input type="radio" name="option" value="${i}"> ${esc(o)}</label>`).join('')}<button class="primary" onclick="doVote(${id})">送出投票</button><p class="muted">展示版僅以姓名檢查重複投票，不能保證一人一票。</p>`})}function doVote(id){let a=state.ann.find(x=>x.id===id),name=document.getElementById('voteName').value.trim(),sel=document.querySelector('input[name=option]:checked');if(!name||!sel)return alert('請填寫姓名並選擇選項');a.votes=a.votes||[];if(a.votes.some(x=>x.name===name))return alert('此姓名已投過票');a.votes.push({name,choice:Number(sel.value)});save();closeModal();render();alert('展示投票成功（僅儲存在此瀏覽器）')}function postMessage(){let n=document.getElementById('msgName').value.trim(),b=document.getElementById('msgBody').value.trim();if(!n||!b)return alert('請填寫姓名與留言內容');state.messages.push({id:Date.now(),name:n,body:b,date:new Date().toLocaleString('zh-TW')});save();render()}function month(delta){let d=new Date(selectedYear,selectedMonth+delta,1);selectedYear=d.getFullYear();selectedMonth=d.getMonth();render()}function showEvents(dt){alert(state.events.filter(e=>e.date===dt).map(e=>e.title+'\n'+e.desc).join('\n\n'))}function addEvent(){modal({title:'＋ 新增活動',body:`<label class="label">日期</label><input class="field" type="date" id="eDate"><label class="label">活動名稱</label><input class="field" id="eTitle"><label class="label">活動說明</label><input class="field" id="eDesc"><button class="primary" onclick="saveEvent()">新增活動</button>`})}function saveEvent(){let date=document.getElementById('eDate').value,title=document.getElementById('eTitle').value.trim(),desc=document.getElementById('eDesc').value.trim();if(!date||!title)return alert('請填寫日期與名稱');state.events.push({id:Date.now(),date,title,desc});save();closeModal();render()}function addAlbum(){modal({title:'＋ 新增相簿',body:`<label class="label">相簿名稱</label><input class="field" id="aTitle"><label class="label">相簿說明</label><input class="field" id="aDesc"><label class="label">代表圖示</label><select class="field" id="aIcon"><option>📸</option><option>🎉</option><option>📚</option><option>🌳</option><option>🏫</option></select><button class="primary" onclick="saveAlbum()">建立相簿</button>`})}function saveAlbum(){let title=document.getElementById('aTitle').value.trim(),desc=document.getElementById('aDesc').value.trim(),icon=document.getElementById('aIcon').value;if(!title)return alert('請輸入名稱');state.albums.push({id:Date.now(),title,desc,icon});save();closeModal();render()}function addAnnouncement(){modal({title:'＋ 新增公告',body:`<label class="label">公告類型</label><select class="field" id="nType" onchange="document.getElementById('extraOptions').classList.toggle('hidden',this.value!=='投票公告');document.getElementById('extraCount').classList.toggle('hidden',this.value!=='報名公告')"><option>文字公告</option><option>報名公告</option><option>投票公告</option></select><label class="label">公告標題</label><input class="field" id="nTitle"><label class="label">公告內容</label><textarea class="field" id="nBody" rows="4"></textarea><div id="extraOptions" class="hidden"><label class="label">投票選項（每行一個）</label><textarea class="field" id="nOptions" rows="3"></textarea></div><div id="extraCount" class="hidden"><label class="label">報名名額</label><input class="field" id="nCount" type="number" min="1" value="20"></div><button class="primary" onclick="saveAnnouncement()">發布公告</button>`})}function saveAnnouncement(){let type=document.getElementById('nType').value,title=document.getElementById('nTitle').value.trim(),body=document.getElementById('nBody').value.trim();if(!title||!body)return alert('請填寫標題與內容');let a={id:Date.now(),type,title,body,date:new Date().toISOString().slice(0,10)};if(type==='投票公告'){a.options=document.getElementById('nOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);if(a.options.length<2)return alert('至少輸入兩個投票選項');a.votes=[]}if(type==='報名公告'){a.count=Math.max(1,Number(document.getElementById('nCount').value)||20);a.entries=[]}state.ann.unshift(a);save();closeModal();render()}theme('B');render();
</script></body></html>
