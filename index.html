.status{padding:12px 16px;border-radius:10px;background:#e8f1ff;color:#174d90;margin:15px 0}.status.bad{background:#fff0e9;color:#994621}.photoimg{width:100%;height:170px;object-fit:cover;border-radius:10px}.muted{color:#65758a}.error{color:#b42318}.success{color:#166534}button:disabled{opacity:.5;cursor:wait} .small{font-size:12px}</style></head><body data-theme="B"><header class="top"><div class="topin"><div class="brand">📚 學習中心<small>電子佈告欄 SYSTEM</small></div><nav class="nav" id="nav"></nav><button class="login" id="loginBtn">管理員登入</button></div></header><main class="wrap"><section class="hero"><div><h1>學習中心電子佈告欄</h1><p>公告消息、活動報名、班級日程與生活花絮</p></div><div class="symbol">📖</div></section><div id="connection" class="status">正在連接 Firebase…</div><div id="view"></div><footer class="footer">學習中心電子佈告欄 · 專業管理系統｜Firebase 雲端版</footer></main><div id="overlay" class="modalbg hidden"><div class="modal" id="modal"></div></div><script type="module">

import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,addDoc,deleteDoc,updateDoc,onSnapshot,query,orderBy,getDocs,where,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDa9pLTU5GtcP3QfaJisU7LR7QndDhTB_s',authDomain:'learning-center-bulletin-board.firebaseapp.com',projectId:'learning-center-bulletin-board',storageBucket:'learning-center-bulletin-board.firebasestorage.app',messagingSenderId:'896434686419',appId:'1:896434686419:web:add2dd72b4934767be4726',measurementId:'G-QT1BLBMQXZ'};
const ADMIN_UID='Kh48JKOeHrUwMfjiXBQX39y9xq32';
const ADMIN_NAME='tnvs3101';
// Firebase Authentication 使用者的內部電子郵件，須與 Firebase Console 建立的使用者一致。
const ADMIN_EMAIL='tnvs3101@example.com';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const pages=['首頁','公告事項','班級行事曆','留言板','生活花絮','管理後台'];
let page='首頁',admin=false,ready=false,monthOffset=0;
const state={ann:[],events:[],messages:[],albums:[],registrations:[],votes:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=v=>v?.toDate?.()?.toLocaleDateString('zh-TW')||v?.slice?.(0,10)||'';
const today=()=>new Date().toLocaleDateString('en-CA');
const $=id=>document.getElementById(id);
const safeError=e=>{console.error(e);alert('操作失敗：'+(e.code||e.message||'未知錯誤')+'。請檢查 Firebase 安全規則及網路連線。')};
function status(message,bad=false){$('connection').textContent=message;$('connection').className='status'+(bad?' bad':'')}
function modal(title,body){$('modal').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="close" data-action="close">×</button></div>${body}`;$('overlay').classList.remove('hidden')}
function closeModal(){$('overlay').classList.add('hidden')}
function navRender(){$('nav').innerHTML=pages.filter(x=>admin||x!=='管理後台').map(p=>`<button data-go="${p}" class="${page===p?'active':''}">${p}</button>`).join('');$('loginBtn').textContent=admin?'管理員登出':'管理員登入'}
function head(t,sub=''){return `<div class="sectionhead"><h2>${t}</h2><span>${sub}</span></div>`}
function countEntries(id){return state.registrations.filter(x=>x.announcementId===id).length}
function countVotes(id){return state.votes.filter(x=>x.announcementId===id).length}
function annCard(a){return `<div class="card"><span class="tag">${esc(a.type)}</span><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p><div class="meta">📅 ${esc(a.date)}</div><div class="actions">${a.type==='報名公告'?`<button class="primary" data-action="signup" data-id="${a.id}">我要報名 ${admin?`(${countEntries(a.id)}/${a.count||'不限'})`:''}</button>`:''}${a.type==='投票公告'?`<button class="primary" data-action="vote" data-id="${a.id}">參與投票</button>`:''}${admin?`<button class="outline" data-action="delete" data-kind="ann" data-id="${a.id}">刪除公告</button>`:''}</div></div>`}
function eventsHtml(){return state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="event"><div class="datebox"><small>${esc(e.date.slice(5,7))}月</small><b>${esc(e.date.slice(8))}</b></div><div><strong>${esc(e.title)}</strong><span>${esc(e.desc)}</span></div>${admin?`<button class="outline" data-action="delete" data-kind="events" data-id="${e.id}">刪除</button>`:''}</div>`).join('')||'<div class="empty">目前沒有活動</div>'}
function messagesHtml(){return state.messages.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(m=>`<div class="message"><strong>👤 ${esc(m.name)}</strong><small>　${dateStr(m.createdAt)}</small><p>${esc(m.content)}</p>${admin?`<button class="outline" data-action="delete" data-kind="messages" data-id="${m.id}">刪除留言</button>`:''}</div>`).join('')||'<div class="empty">還沒有留言</div>'}
function albumsHtml(){return state.albums.map(a=>`<div class="card">${a.imageUrl?`<img class="photoimg" src="${esc(a.imageUrl)}" alt="相簿封面" loading="lazy">`:`<div class="photo">📸</div>`}<h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p>${admin?`<button class="outline" data-action="delete" data-kind="albums" data-id="${a.id}">刪除相簿</button>`:''}</div>`).join('')||'<div class="empty">目前沒有相簿</div>'}
function calendarHtml(){const now=new Date(),dt=new Date(now.getFullYear(),now.getMonth()+monthOffset,1),y=dt.getFullYear(),m=dt.getMonth();let first=dt.getDay(),total=new Date(y,m+1,0).getDate();let cells=['日','一','二','三','四','五','六'].map(x=>`<div class="day h">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=total;d++){const day=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=state.events.some(e=>e.date===day);cells+=`<div class="day ${has?'eventday':''}" ${has?`data-action="showday" data-day="${day}"`:''}>${d}${has?'<div class="dot"></div>':''}</div>`}return `<div class="card"><div class="toolbar" style="justify-content:space-between;margin-bottom:15px"><button class="outline" data-action="month" data-delta="-1">‹ 上個月</button><strong>${y} 年 ${m+1} 月</strong><button class="outline" data-action="month" data-delta="1">下個月 ›</button></div><div class="cal">${cells}</div></div>`}
function render(){navRender();const v=$('view');if(!ready){v.innerHTML='<div class="card">正在讀取雲端資料…</div>';return}if(page==='首頁'){v.innerHTML=head('📢 最新公告')+`<div class="grid">${state.ann.slice(0,3).map(annCard).join('')||'<div class="card">目前沒有公告</div>'}</div>`+head('📅 近期活動')+`<div class="card">${eventsHtml()}</div>`+head('📸 生活花絮')+`<div class="grid">${albumsHtml()}</div>`}else if(page==='公告事項'){v.innerHTML=head('📢 公告事項','文字公告 · 報名公告 · 投票公告')+(admin?'<button class="primary" data-action="addann">＋ 新增公告</button>':'')+`<div class="grid" style="margin-top:15px">${state.ann.map(annCard).join('')||'<div class="card">目前沒有公告</div>'}</div>`}else if(page==='班級行事曆'){v.innerHTML=head('📅 班級行事曆')+(admin?'<button class="primary" data-action="addevent">＋ 新增活動</button>':'')+`<div class="row" style="margin-top:15px">${calendarHtml()}<div class="card"><h3>活動清單</h3>${eventsHtml()}</div></div>`}else if(page==='留言板'){v.innerHTML=head('💬 留言板')+`<div class="row"><div class="card"><h3>我要留言</h3><label class="label">姓名</label><input class="field" id="msgName" maxlength="30"><label class="label">留言內容</label><textarea class="field" id="msgBody" rows="5" maxlength="500"></textarea><button class="primary" data-action="postmsg">送出留言</button></div><div class="card"><h3>最新留言</h3>${messagesHtml()}</div></div>`}else if(page==='生活花絮'){v.innerHTML=head('📸 生活花絮')+(admin?'<button class="primary" data-action="addalbum">＋ 新增相簿</button>':'')+`<div class="grid" style="margin-top:15px">${albumsHtml()}</div><p class="muted">目前可使用圖片網址建立相簿。Firebase Storage 照片上傳功能需要另外啟用儲存空間。</p>`}else{v.innerHTML=admin?head('🔐 管理後台')+`<div class="adminbar">✓ 管理員已登入，資料與 Firebase 同步。</div><div class="grid"><div class="card"><h3>📢 公告</h3><p>${state.ann.length} 則</p><button class="primary" data-go="公告事項">管理公告</button></div><div class="card"><h3>📅 活動</h3><p>${state.events.length} 個</p><button class="primary" data-go="班級行事曆">管理活動</button></div><div class="card"><h3>💬 留言</h3><p>${state.messages.length} 則</p><button class="primary" data-go="留言板">管理留言</button></div><div class="card"><h3>📸 相簿</h3><p>${state.albums.length} 個</p><button class="primary" data-go="生活花絮">管理相簿</button></div></div><div class="card"><h3>📝 報名名單</h3>${state.ann.filter(a=>a.type==='報名公告').map(a=>`<h4>${esc(a.title)}</h4><p>${state.registrations.filter(r=>r.announcementId===a.id).map(r=>esc(r.name)).join('、')||'尚無報名'}</p>`).join('')||'目前沒有報名公告'}<h3>🗳️ 投票統計</h3>${state.ann.filter(a=>a.type==='投票公告').map(a=>`<h4>${esc(a.title)}</h4>${(a.options||[]).map((o,i)=>`<p>${esc(o)}：${state.votes.filter(x=>x.announcementId===a.id&&x.choice===i).length} 票</p>`).join('')}`).join('')||'目前沒有投票公告'}</div>`:head('管理後台')+'<div class="card">請先登入管理員。</div>'}}
function login(){modal('🔐 管理員登入',`<label class="label">管理員帳號</label><input class="field" id="loginName" autocomplete="username"><label class="label">管理員密碼</label><input class="field" id="loginPass" type="password" autocomplete="current-password"><button class="primary" data-action="dologin">登入</button><p class="muted small">密碼由 Firebase Authentication 驗證，不會寫在公開網頁中。</p>`)}
async function doLogin(){if($('loginName').value.trim()!==ADMIN_NAME)return alert('帳號或密碼錯誤');try{const credential=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$('loginPass').value);if(credential.user.uid!==ADMIN_UID){await signOut(auth);throw Error('此帳號沒有管理員權限')}closeModal();page='管理後台';render()}catch(e){console.error(e);alert('登入失敗，請確認帳號密碼及 Firebase Authentication 使用者設定。')}}
async function remove(kind,id){if(!admin||!confirm('確定刪除這筆資料？'))return;try{const table={ann:'announcements',events:'calendar',messages:'messages',albums:'albums'}[kind];await deleteDoc(doc(db,table,id))}catch(e){safeError(e)}}
function addAnn(){modal('＋ 新增公告',`<label class="label">公告類型</label><select class="field" id="nType"><option>文字公告</option><option>報名公告</option><option>投票公告</option></select><label class="label">標題</label><input class="field" id="nTitle" maxlength="100"><label class="label">內容</label><textarea class="field" id="nBody" rows="4" maxlength="3000"></textarea><label class="label">投票選項（投票公告填寫，每行一個）</label><textarea class="field" id="nOptions" rows="3"></textarea><label class="label">報名名額（報名公告填寫）</label><input class="field" id="nCount" type="number" min="1" value="20"><button class="primary" data-action="saveann">發布公告</button>`)}
async function saveAnn(){const type=$('nType').value,title=$('nTitle').value.trim(),body=$('nBody').value.trim(),options=$('nOptions').value.split('\n').map(x=>x.trim()).filter(Boolean),count=Number($('nCount').value);if(!title||!body)return alert('請填寫標題和內容');if(type==='投票公告'&&(options.length<2||options.length>12))return alert('投票需 2～12 個選項');if(type==='報名公告'&&(!Number.isInteger(count)||count<1))return alert('請填寫有效名額');try{await addDoc(collection(db,'announcements'),{type,title,body,date:today(),options:type==='投票公告'?options:[],count:type==='報名公告'?count:0,createdAt:serverTimestamp()});closeModal()}catch(e){safeError(e)}}
function addEvent(){modal('＋ 新增活動',`<label class="label">日期</label><input class="field" type="date" id="eDate"><label class="label">活動名稱</label><input class="field" id="eTitle" maxlength="100"><label class="label">活動說明</label><input class="field" id="eDesc" maxlength="500"><button class="primary" data-action="saveevent">新增活動</button>`)}
async function saveEvent(){const date=$('eDate').value,title=$('eTitle').value.trim(),desc=$('eDesc').value.trim();if(!date||!title)return alert('請填寫日期與名稱');try{await addDoc(collection(db,'calendar'),{date,title,desc,createdAt:serverTimestamp()});closeModal()}catch(e){safeError(e)}}
function addAlbum(){modal('＋ 新增相簿',`<label class="label">相簿名稱</label><input class="field" id="aTitle" maxlength="100"><label class="label">相簿說明</label><input class="field" id="aDesc" maxlength="500"><label class="label">圖片網址（HTTPS，可留空）</label><input class="field" id="aImage" placeholder="https://..."><button class="primary" data-action="savealbum">建立相簿</button>`)}
async function saveAlbum(){const title=$('aTitle').value.trim(),desc=$('aDesc').value.trim(),imageUrl=$('aImage').value.trim();if(!title)return alert('請輸入名稱');if(imageUrl&&!/^https:\/\//i.test(imageUrl))return alert('圖片必須使用 HTTPS 網址');try{await addDoc(collection(db,'albums'),{title,desc,imageUrl,createdAt:serverTimestamp()});closeModal()}catch(e){safeError(e)}}
async function postMessage(){const name=$('msgName').value.trim(),content=$('msgBody').value.trim();if(!name||!content||name.length>30||content.length>500)return alert('請輸入姓名及 500 字以內留言');try{await addDoc(collection(db,'messages'),{name,content,createdAt:serverTimestamp()});$('msgName').value='';$('msgBody').value='';alert('留言已送出')}catch(e){safeError(e)}}
function signup(id){const a=state.ann.find(x=>x.id===id);if(!a)return;modal('📝 活動報名',`<p>${esc(a.title)}</p><label class="label">報名姓名</label><input class="field" id="signName" maxlength="30"><button class="primary" data-action="dosign" data-id="${id}">確認報名</button><p class="muted small">無登入的姓名可能被冒用，請勿填寫敏感個資。</p>`)}
async function doSignup(id){const name=$('signName').value.trim();if(!name)return alert('請輸入姓名');try{await addDoc(collection(db,'registrations'),{announcementId:id,name,createdAt:serverTimestamp()});closeModal();alert('報名已送出（目前尚未實作可靠的名額及重複報名限制）')}catch(e){safeError(e)}}
function vote(id){const a=state.ann.find(x=>x.id===id);if(!a)return;modal('🗳️ 參與投票',`<p>${esc(a.title)}</p><label class="label">姓名</label><input class="field" id="voteName" maxlength="30">${(a.options||[]).map((o,i)=>`<label style="display:block;padding:9px"><input type="radio" name="option" value="${i}"> ${esc(o)}</label>`).join('')}<button class="primary" data-action="dovote" data-id="${id}">送出投票</button><p class="muted small">目前匿名投票無法確保一人一票。</p>`)}
async function doVote(id){const name=$('voteName').value.trim(),opt=document.querySelector('input[name=option]:checked');if(!name||!opt)return alert('請填寫姓名並選擇選項');try{await addDoc(collection(db,'votes'),{announcementId:id,name,choice:Number(opt.value),createdAt:serverTimestamp()});closeModal();alert('投票已送出')}catch(e){safeError(e)}}
// 事件委派，避免在 HTML 中插入不可信的 JavaScript。
document.addEventListener('click',async e=>{if(e.target===$('overlay'))closeModal();const b=e.target.closest('[data-action],[data-go]');if(!b)return;if(b.dataset.go){page=b.dataset.go;render();window.scrollTo(0,0);return}const a=b.dataset.action,id=b.dataset.id;switch(a){case'close':closeModal();break;case'dologin':await doLogin();break;case'delete':await remove(b.dataset.kind,id);break;case'addann':addAnn();break;case'saveann':await saveAnn();break;case'addevent':addEvent();break;case'saveevent':await saveEvent();break;case'addalbum':addAlbum();break;case'savealbum':await saveAlbum();break;case'postmsg':await postMessage();break;case'signup':signup(id);break;case'dosign':await doSignup(id);break;case'vote':vote(id);break;case'dovote':await doVote(id);break;case'month':monthOffset+=Number(b.dataset.delta);render();break;case'showday':alert(state.events.filter(x=>x.date===b.dataset.day).map(x=>x.title+'\n'+x.desc).join('\n\n'));break}});
$('loginBtn').addEventListener('click',async()=>{if(admin){await signOut(auth);page='首頁'}else login()});
onAuthStateChanged(auth,user=>{admin=!!user&&user.uid===ADMIN_UID;if(user&&!admin)signOut(auth);render()});
let loaded=new Set();const tables={ann:'announcements',events:'calendar',messages:'messages',albums:'albums'};
for(const [key,table] of Object.entries(tables)){onSnapshot(collection(db,table),snap=>{state[key]=snap.docs.map(d=>({id:d.id,...d.data()}));if(key==='ann')state[key].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));loaded.add(key);if(loaded.size===4){ready=true;status('☁️ 已連接 Firebase，資料由雲端同步');render()}},e=>{ready=true;status('⚠️ 無法讀取 '+table+'：'+e.message,true);render()})}
// 私有報名與投票名單：只有管理員訂閱，避免學生取得其他人的姓名。
let stopPrivate=[];onAuthStateChanged(auth,user=>{stopPrivate.forEach(fn=>fn());stopPrivate=[];state.registrations=[];state.votes=[];if(user?.uid===ADMIN_UID){for(const [key,table] of [['registrations','registrations'],['votes','votes']])stopPrivate.push(onSnapshot(collection(db,table),snap=>{state[key]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},console.error))}render()});
render();

</script></body></html>
